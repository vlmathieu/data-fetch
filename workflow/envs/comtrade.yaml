channels:
  - conda-forge
dependencies:
  - python =3.12
  - polars =1.33.1
  - pandas =2.2.*          # comtradeapicall returns pandas DataFrames
  - urllib3 =2.2.*
  - requests =2.32.*      # comtradeapicall imports it (GroupCalc), and never
                          # declared it: the env only ever worked because
                          # Snakemake leaked the parent env's copy in. Rebuild
                          # the env without this line and every rule importing
                          # comtradeapicall dies on ModuleNotFoundError.
  - pyyaml
  - tqdm =4.67.*          # progress display, comtrade_progress.py
  - pip
  - pip:
      # 1.3.2 (2026-06-11): brings getCountFinalData / previewCountFinalData.
      - comtradeapicall ==1.3.2
